name: TS

on:
  push:
  pull_request:

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hts
          POSTGRES_PASSWORD: hts
          POSTGRES_DB: hts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hts -d hts_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hts:hts@localhost:5432/hts_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Shared files are in sync
        run: |
          pnpm --filter api contracts:generate
          pnpm sync:shared
          git status --porcelain
          test -z "$(git status --porcelain)"
      - run: pnpm test
