name: iOS

on:
  push:
    branches: [main]
    paths:
      - apps/ios/**
      - packages/**
      - Makefile
      - scripts/ios-simulator-id.sh
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - apps/ios/**
      - packages/**
      - Makefile
      - scripts/ios-simulator-id.sh
      - .github/workflows/ios.yml

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-latest (arm64) often gets no runner on GitHub's free tier; the Intel image has more capacity (#33).
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | grep -E "^--|iPhone 17 Pro Max" || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Lint Swift
        run: make ios-lint
      - name: Test HTSKit
        run: make ios-kit-test
      - name: Generate project
        run: make ios-generate
      # No code signing: simulator build only. TestFlight needs a paid Apple account (separate ticket).
      - name: Build app for the simulator
        run: make ios-build
