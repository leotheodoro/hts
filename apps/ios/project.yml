name: HTS
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: $(HTS_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  HTSKit:
    path: HTSKit

targets:
  HTS:
    type: application
    platform: iOS
    sources:
      - path: HTS
    dependencies:
      - package: HTSKit
        product: HTSDesign
      - package: HTSKit
        product: HTSDomain
      - package: HTSKit
        product: HTSPersistence
      - package: HTSKit
        product: HTSAPI
    info:
      path: HTS/Info.plist
      properties:
        CFBundleDisplayName: HTS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # Keeps navigation bars and sheets without Liquid Glass where the system honors it. The tab bar is drawn by
        # the app (docs/decisions/0022).
        UIDesignRequiresCompatibility: true
        ITSAppUsesNonExemptEncryption: false
        HTSAPIBaseURL: $(HTS_API_BASE_URL)
        NSCameraUsageDescription: O HTS usa a câmera para tirar a sua foto de perfil.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: O HTS acessa a rede local só em builds de desenvolvimento, para falar com a API no seu Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HTS_BUNDLE_ID)
        PRODUCT_NAME: HTS
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

  HTSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HTSTests
    dependencies:
      - target: HTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HTS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  HTS:
    build:
      targets:
        HTS: all
        HTSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HTSTests
    archive:
      config: Release
